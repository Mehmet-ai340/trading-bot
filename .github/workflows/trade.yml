name: AI Trading Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt
      - name: Botu calistir
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          STARTING_CAPITAL: "5000"
        run: python bot.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A 2>/dev/null || true
          git commit -m "bot durum" 2>/dev/null || echo nochange
          git push 2>/dev/null || echo nopush
